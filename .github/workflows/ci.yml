name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: audited-current
            python: "3.14"
            requirements: requirements_dev.txt
          - lane: legacy-compatibility
            python: "3.13"
            requirements: requirements_compat.txt
          - lane: production-compatibility
            python: "3.14"
            requirements: requirements_production_compat.txt
    name: Test (${{ matrix.lane }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # Existing v7
        with:
          version: "0.13.9" # Patched installer; never execute Core's legacy uv.
          # GitHub release digest for the ubuntu-latest x86_64 Linux archive.
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"

      - name: Set up Python
        run: uv python install '${{ matrix.python }}'

      - name: Create virtualenv
        run: uv venv .venv --seed --python '${{ matrix.python }}'

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r '${{ matrix.requirements }}' .

      - name: Validate installed dependencies
        run: .venv/bin/python -m pip check

      - name: Ruff
        run: ./.venv/bin/ruff check custom_components tests

      - name: Pytest
        run: PYTHONPATH=. ./.venv/bin/pytest --cov=custom_components/vision_roi_guard --cov-branch

      - name: Audit current environment
        if: matrix.lane == 'audited-current'
        run: .venv/bin/python -m pip_audit
